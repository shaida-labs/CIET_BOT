[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=$TRUSTED_PROXY_IPS --no-server-header"
healthcheckPath = "/readyz"
restartPolicyType = "ON_FAILURE"
