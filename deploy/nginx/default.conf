map $uri $ciet_cache_control {
  default "";
  "/ciet-ai.js" "no-cache";
  ~^/admin/assets/ "public, max-age=31536000, immutable";
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/widget/assets/ "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 https:; frame-ancestors 'self'" always;
  add_header Cache-Control $ciet_cache_control always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /widget/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /widget/index.html;
  }

  location /ciet-ai.js {
    alias /usr/share/nginx/html/widget/ciet-ai.js;
  }

  location ~* ^/admin/assets/.*\.(js|css|svg|png|woff2)$ {
    root /usr/share/nginx/html;
  }

  location /admin/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /admin/index.html;
  }

  location = /admin {
    return 301 /admin/;
  }

  location /assets/ {
    alias /usr/share/nginx/html/admin/assets/;
  }

  location = /favicon.svg {
    alias /usr/share/nginx/html/admin/favicon.svg;
  }
}
