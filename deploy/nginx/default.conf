map $uri $ciet_cache_control {
  default "";
  "/ciet-ai.js" "no-cache";
  ~^/admin/assets/ "public, max-age=31536000, immutable";
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/widget/assets/ "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 https:; frame-ancestors 'self'" always;
  add_header Cache-Control $ciet_cache_control always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Same-origin API relay. The admin bundle calls relative /api/... paths, so
  # the page works from any host (localhost, LAN IP, deployed domain) without a
  # rebuild, CORS allowance, or a connect-src entry per address.
  # resolver + variable keeps Docker DNS resolution fresh when the api
  # container is recreated and its address changes.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ciet_api_upstream http://api:8000;
    proxy_pass $ciet_api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:8000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    # Matches the API's MAX_UPLOAD_BYTES (25 MiB); nginx defaults to 1m.
    client_max_body_size 30m;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /widget/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /widget/index.html;
  }

  location /ciet-ai.js {
    alias /usr/share/nginx/html/widget/ciet-ai.js;
  }

  location ~* ^/admin/assets/.*\.(js|css|svg|png|woff2)$ {
    root /usr/share/nginx/html;
  }

  location /admin/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /admin/index.html;
  }

  location = /admin {
    return 301 /admin/;
  }

  location = /widget {
    return 301 /widget/;
  }

  location = /accept-invitation {
    return 302 /admin/accept-invitation$is_args$args;
  }

  location /assets/ {
    alias /usr/share/nginx/html/admin/assets/;
  }

  location = /favicon.svg {
    alias /usr/share/nginx/html/widget/favicon.svg;
  }

  location = /favicon.ico {
    alias /usr/share/nginx/html/widget/favicon.svg;
  }

  location / {
    root /usr/share/nginx/html/widget;
    try_files $uri $uri/ /widget/index.html /index.html =404;
  }
}
