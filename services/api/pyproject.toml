[project]
name = "ciet-ai-api"
version = "2.0.0"
description = "Shared backend for the CIET AI Assistant widget, WhatsApp assistant, and admin dashboard."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "bcrypt>=5.0.0",
  "boto3>=1.35.0",
  "celery[redis]>=5.4.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openai>=1.93.0",
  "openpyxl>=3.1.5",
  "pinecone>=5.3.1",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "pypdf>=4.3.1",
  "python-docx>=1.1.2",
  "PyJWT[crypto]>=2.10.1",
  "python-multipart>=0.0.9",
  "redis>=5.0.8",
  "sentry-sdk[fastapi]>=2.13.0",
  "slowapi>=0.1.9",
  "sqlalchemy[asyncio]>=2.0.32",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.3"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
