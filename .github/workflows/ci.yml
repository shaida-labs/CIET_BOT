name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:e2e
      - run: npm audit --audit-level=high

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ciet_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ciet_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ciet_ai_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET: ci-only-secret-value-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install --require-hashes -r services/api/requirements.lock
      - run: pip install pytest ruff pip-audit
      - run: cd services/api && pip-audit -r requirements.lock
      - run: pip check
      - run: cd services/api && ruff check app tests
      - run: cd services/api && pytest
      - run: cd services/api && alembic upgrade head
      - run: cd services/api && alembic downgrade base
      - run: cd services/api && alembic upgrade head

  containers:
    runs-on: ubuntu-latest
    needs: [frontend, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for the live stack
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8000/readyz >/dev/null && curl --fail --silent http://localhost:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - run: npm run test:e2e:live
      - run: docker compose exec -T api python -m scripts.live_rbac_check
      - if: always()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down
